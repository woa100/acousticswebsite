<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Insights on acoustics, noise control and sound environments from Willem Boning at From the Sound Up.">
    <title>Blog | From the Sound Up</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>
    {% include header.html %}

    <section class="blog-landing">
        <div class="container">

            <h2>Blog</h2>

            <div class="blog-post-list">
                {% for post in site.posts %}
                <article class="blog-card">

                    <a href="{{ post.url }}" class="blog-card-image-link" tabindex="-1" aria-hidden="true">
                        {% if post.image %}
                        <img src="{{ post.image }}" alt="{{ post.title }}" class="blog-card-img">
                        {% else %}
                        <div class="blog-card-placeholder"></div>
                        {% endif %}
                    </a>

                    <div class="blog-card-body">
                        <p class="post-date">{{ post.date | date: "%B %-d, %Y" }}</p>
                        <h3 class="blog-card-title">
                            <a href="{{ post.url }}">{{ post.title }}</a>
                        </h3>
                        <p class="blog-card-excerpt">{{ post.content | strip_html | truncatewords: 55 }}</p>
                        <a href="{{ post.url }}" class="blog-read-more">Read more...</a>
                    </div>

                </article>
                {% endfor %}
            </div>

        </div>
    </section>

  {% include footer.html %}

    <script>
        function initializeNavigation() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            if (!hamburger || !navMenu) return;
            hamburger.addEventListener('click', toggleMobileMenu);
            hamburger.addEventListener('keydown', handleHamburgerKeydown);
            document.querySelectorAll('.nav-menu a').forEach(item => {
                item.addEventListener('click', closeMobileMenu);
            });
            function toggleMobileMenu() { navMenu.classList.toggle('active'); updateAriaExpanded(); }
            function handleHamburgerKeydown(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMobileMenu(); } }
            function closeMobileMenu() { navMenu.classList.remove('active'); updateAriaExpanded(); }
            function updateAriaExpanded() { hamburger.setAttribute('aria-expanded', navMenu.classList.contains('active')); }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeNavigation);
        } else {
            initializeNavigation();
        }
    </script>

</body>
</html>
