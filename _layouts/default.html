
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ page.meta }}
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>
    <header>
        <div class="banner-container">
            <nav>
                <a href="/" class="logo" aria-label="From the Sound Up Acoustical Consultant - Home">
                    From the Sound Up<br class="mobile-only">
                    <span class="separator"> | </span><span class="lighttext">Acoustical Consultant</span>
                </a>

                <ul class="nav-menu" role="navigation" aria-label="Main navigation">
                    <li><a href="/#intro">Home</a></li>
                    <li><a href="/#services">Services</a></li>
                    <li><a href="/#about">About</a></li>
                    <li><a href="/#portfolio">Featured Projects</a></li>
                    <li><a href="/#testimonials">Testimonials</a></li>
                    <li><a href="/blog">Insights</a></li>
                    <li><a href="/#get-started">Contact</a></li>
                </ul>

                <div class="hamburger" role="button" aria-label="Toggle navigation menu" tabindex="0">
                    <div class="line1"></div>
                    <div class="line2"></div>
                    <div class="line3"></div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

{% include footer.html %}

    <script>
        function initializeNavigation() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            if (!hamburger || !navMenu) return;
            hamburger.addEventListener('click', toggleMobileMenu);
            hamburger.addEventListener('keydown', handleHamburgerKeydown);
            document.querySelectorAll('.nav-menu a').forEach(item => {
                item.addEventListener('click', closeMobileMenu);
            });
            function toggleMobileMenu() { navMenu.classList.toggle('active'); updateAriaExpanded(); }
            function handleHamburgerKeydown(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMobileMenu(); } }
            function closeMobileMenu() { navMenu.classList.remove('active'); updateAriaExpanded(); }
            function updateAriaExpanded() { hamburger.setAttribute('aria-expanded', navMenu.classList.contains('active')); }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeNavigation);
        } else {
            initializeNavigation();
        }
    </script>

</body>
</html>
