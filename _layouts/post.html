<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description }}">
    <title>{{ page.title }} | From the Sound Up</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>
     {% include header.html %}

    <section class="post">

        <div class="container">

            <!-- Post title and date -->
            <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
            <h2>{{ page.title }}</h2>

            <!-- Post body — 800px centered column, inside .container just like
                 the portfolio section on the homepage, so widths align correctly -->
            <div class="portfolio-container post-content">

                {{ content }}

                <!-- CTA -->
                <div class="post-cta">
                    <a href="/#get-started" class="btn">Tell me how I can help!</a>
                </div>

            </div>

        </div>

    </section>

{% include footer.html %}

    <script>
        function initializeNavigation() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            if (!hamburger || !navMenu) return;
            hamburger.addEventListener('click', toggleMobileMenu);
            hamburger.addEventListener('keydown', handleHamburgerKeydown);
            document.querySelectorAll('.nav-menu a').forEach(item => {
                item.addEventListener('click', closeMobileMenu);
            });
            function toggleMobileMenu() { navMenu.classList.toggle('active'); updateAriaExpanded(); }
            function handleHamburgerKeydown(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMobileMenu(); } }
            function closeMobileMenu() { navMenu.classList.remove('active'); updateAriaExpanded(); }
            function updateAriaExpanded() { hamburger.setAttribute('aria-expanded', navMenu.classList.contains('active')); }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeNavigation);
        } else {
            initializeNavigation();
        }
    </script>

</body>
</html>
